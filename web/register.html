<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Wi-Fi Signal Strength Visualization System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="appNavbar"></div>

  <div class="auth-page-container">
    <!-- Ambient Gradient Glow Orbs -->
    <div class="auth-glow-orb-1"></div>
    <div class="auth-glow-orb-2"></div>

    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand-pill">
            <i class="fa-solid fa-wifi"></i>
            <span>Wi-Fi Signal Mapper</span>
          </div>
          <div class="auth-icon-circle">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">
            Join the indoor Wi-Fi survey system to record, isolate, and visualize signal metrics
          </p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label" for="username">Full Name / Username</label>
            <div class="form-input-group">
              <i class="fa-solid fa-user form-input-icon"></i>
              <input type="text" id="username" class="form-control" placeholder="Ifeanyi Deliverance" required minlength="3">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="userType">User Type / Role</label>
            <div class="form-input-group">
              <i class="fa-solid fa-user-gear form-input-icon"></i>
              <select id="userType" class="form-control">
                <option value="Student">Student / Researcher</option>
                <option value="Network Administrator">Network Administrator</option>
                <option value="Home User">Home User</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="form-input-group">
              <i class="fa-solid fa-envelope form-input-icon"></i>
              <input type="email" id="email" class="form-control" placeholder="ifeanyi@yahoo.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-group password-input-wrapper">
              <i class="fa-solid fa-key form-input-icon"></i>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
              <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Show password" title="Show password">
                <i class="fa-solid fa-eye eye-icon"></i>
                <i class="fa-solid fa-eye-slash eye-off-icon" style="display: none;"></i>
              </button>
            </div>
            <div class="password-requirements" id="pwdReq">
              <i class="fa-regular fa-circle" id="pwdReqIcon"></i>
              <span>Minimum 6 characters required</span>
            </div>
          </div>

          <button type="submit" id="regSubmitBtn" class="btn-auth-submit">
            <i class="fa-solid fa-user-check"></i>
            <span>Register Account</span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in here</a>
          <div>
            <a href="index.html" class="auth-back-link">
              <i class="fa-solid fa-arrow-left"></i>
              <span>Back to Homepage</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    renderNavbar('register');
    redirectIfLoggedIn();
    setupPasswordToggle();

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('regSubmitBtn');
    const pwdInput = document.getElementById('password');
    const pwdReq = document.getElementById('pwdReq');
    const pwdReqIcon = document.getElementById('pwdReqIcon');

    // Real-time password length indicator
    pwdInput.addEventListener('input', () => {
      const isValid = pwdInput.value.length >= 6;
      if (isValid) {
        pwdReq.classList.add('valid');
        pwdReqIcon.className = 'fa-solid fa-circle-check';
      } else {
        pwdReq.classList.remove('valid');
        pwdReqIcon.className = 'fa-regular fa-circle';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Creating Account...</span>';

      try {
        const res = await apiRequest('/auth/register', {
          method: 'POST',
          body: { username, email, password }
        });

        if (res.success) {
          showToast('Account created successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 900);
        } else {
          showToast(res.message || 'Registration failed.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-user-check"></i><span>Register Account</span>';
        }
      } catch (err) {
        showToast(err.message || 'Error communicating with server.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-user-check"></i><span>Register Account</span>';
      }
    });
  </script>
</body>
</html>
